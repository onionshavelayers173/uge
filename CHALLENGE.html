const heldKeys = new Set();

let running = true;
let score = 0;
let health = 50;
let time = -song.offset * (song.bpm / 60);

setInterval(main, 1000 / fps);

function main() {
    
    ctx.fillStyle = "black";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    for (let i = 0; i < song.keys; i++) {
        ctx.fillStyle = heldKeys.has(song.keybinds[i]) ? "hsla(0 0% 100% / 75%)" : "hsla(0 0% 100% / 25%)";
        const noteX = (canvas.width / 2) + i * ((noteRadius + noteSpacing) * 2) - (song.keys - 1) * (noteRadius + noteSpacing);
        ctx.beginPath();
        ctx.arc(
            noteX,
            baseHeight,
            noteRadius,
            0,
            2 * Math.PI
        );
        ctx.fill();
        
        if (time < 0) {
            ctx.save();
            ctx.fillStyle = "hsla(0 0% 100% / 50%)";
            ctx.font = "32px sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(song.keybinds[i][3], noteX, baseHeight);
            ctx.restore();
        }
    }
    
    ctx.fillStyle = "hsla(0 0% 100% / 50%)";
    ctx.font = "64px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(score, canvas.width / 2, 150);
    
    // things here
    
    ctx.fillStyle = "skyblue";
    for (let i = 0; i < song.notes.length; i++) {
        const note = song.notes[i];
        const noteColumn = note[0];
        const noteTime = note[1];
        const noteWidth = noteRadius + noteSpacing;
        const noteX = (canvas.width / 2) + (2 * noteWidth * noteColumn) - noteWidth * (song.keys - 1);
        ctx.beginPath();
        ctx.arc(
            noteX,
            baseHeight - noteSpeed * (noteTime - time),
            noteRadius,
            0,
            2 * Math.PI
        );
        ctx.fill();
    }
    
    for (let i = 0; i < song.notes.length; i++) {
        if (song.notes[i][1] - time < -1) {
            song.notes.splice(i, 1);
            health -= 20;
        }
    }
    
    if (health <= 0) {
        running = false;
        health = 0;
    } else if (health > 100) {
        health = 100;
    }
    
    ctx.fillStyle = "red";
    ctx.fillRect(canvas.width - 100, 100, 10, canvas.height - 200);
    
    ctx.fillStyle = "green";
    ctx.fillRect(canvas.width - 100, canvas.height - 100, 10, -health / 100 * (canvas.height - 200));
    
    
    
    if (running) {
        time += (1 / fps) * (song.bpm / 60);
    } else {
        ctx.fillStyle = "hsla(0 0% 100%)";
        ctx.font = "86px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("Dead", canvas.width / 2, canvas.height / 2);
    }
    
}

function findNote(column) {
    
    let index;
    
    for (let i = 0; i < song.notes.length; i++) {
        if (song.notes[i][0] !== column) continue;
        
        if (index !== undefined) {
            if (Math.abs(song.notes[i][1] - time) < Math.abs(song.notes[index][1] - time)) {
                index = i;
            }
        } else {
            index = i;
        }
    }
    
    return index;
    
}

function hitNote(index) {
    let noteTime = song.notes[index][1];
    
    let difference = Math.abs(noteTime - time);
    
    if (difference > okHitThreshold) return false;
    
    if (difference <= perfectHitThreshold) {
        score += 50;
        health += 5;
    } else if (difference <= greatHitThreshold) {
        score += 40;
        health += 3;
    } else if (difference <= goodHitThreshold) {
        score += 30;
        health += 2;
    } else if (difference <= alrightHitThreshold) {
        score += 20;
        health += 1;
    } else if (difference <= okHitThreshold) {
        score += 10;
    }
    
    song.notes.splice(index, 1);
    
    return true;
}

window.addEventListener("keydown", event => {
    if (event.repeat || !running) return;
    
    const column = song.keybinds.indexOf(event.code);
    
    if (column === -1) return;
    
    heldKeys.add(event.code);

    const index = findNote(column);
    if (index !== undefined) {
        if (hitNote(index)) return;
    }
    
    health -= 10;
});

window.addEventListener("keyup", event => {
    if (event.repeat || !running) return;
    
    const column = song.keybinds.indexOf(event.code);
    
    if (column === -1) return;
    
    heldKeys.delete(event.code);
});
